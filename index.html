<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JS Practice Set</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1b1f24; --muted: #5b6470; --border: #dde1e6;
  --accent: #2f6fdb; --accent-text: #ffffff; --pass: #1f8a4c; --fail: #c4352b; --warn: #a86400;
  --code-bg: #f0f2f5; --editor-bg: #fbfbfc; --chip: #eef2fa;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111418; --panel: #1a1e24; --text: #e6e9ee; --muted: #9aa3ae; --border: #2c323b;
    --accent: #5b93f0; --accent-text: #0d1117; --pass: #4cc47e; --fail: #f0736a; --warn: #e0a54a;
    --code-bg: #232831; --editor-bg: #14181d; --chip: #222a38;
  }
}
:root[data-theme="dark"] {
  --bg: #111418; --panel: #1a1e24; --text: #e6e9ee; --muted: #9aa3ae; --border: #2c323b;
  --accent: #5b93f0; --accent-text: #0d1117; --pass: #4cc47e; --fail: #f0736a; --warn: #e0a54a;
  --code-bg: #232831; --editor-bg: #14181d; --chip: #222a38;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
code, pre, textarea { font-family: ui-monospace, "Cascadia Code", Consolas, Menlo, monospace; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
header h1 { font-size: 17px; margin: 0; }
header .sub { color: var(--muted); font-size: 13px; }
.timer { display: flex; align-items: center; gap: 8px; }
.timer .clock { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 56px; text-align: right; }
.timer .clock.low { color: var(--fail); }
.layout { display: grid; grid-template-columns: 240px 1fr; max-width: 1200px; margin: 0 auto; }
nav.list { padding: 16px 12px; border-right: 1px solid var(--border); min-height: calc(100vh - 58px); }
nav.list button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: none; border: 0;
  color: var(--text); padding: 8px 10px; border-radius: 6px; cursor: pointer; font: inherit; font-size: 14px; }
nav.list button:hover { background: var(--chip); }
nav.list button.active { background: var(--chip); font-weight: 600; }
nav.list .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--border); flex: none; display: grid; place-items: center; font-size: 11px; }
nav.list .dot.done { background: var(--pass); border-color: var(--pass); color: #fff; }
nav.list .tag { margin-left: auto; font-size: 11px; color: var(--muted); }
.progress { font-size: 13px; color: var(--muted); padding: 0 10px 10px; }
main { padding: 20px 24px 60px; min-width: 0; }
.q-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.q-head h2 { margin: 0; font-size: 21px; }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--chip); color: var(--muted); }
.desc p { margin: 10px 0; }
.desc code, .examples code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; font-size: 13.5px; }
.desc ul { margin: 8px 0; padding-left: 22px; }
.examples { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; margin: 12px 0; }
.examples div { margin: 4px 0; overflow-wrap: anywhere; }
.examples .label { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.editor-wrap { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--editor-bg); }
.editor-bar { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--border);
  font-size: 12px; color: var(--muted); background: var(--panel); }
textarea.editor { width: 100%; min-height: 260px; border: 0; outline: none; resize: vertical; padding: 12px 14px;
  background: var(--editor-bg); color: var(--text); font-size: 14px; line-height: 1.5; tab-size: 2; white-space: pre; }
.fixed-html { margin: 0; padding: 10px 14px; font-size: 13px; background: var(--code-bg); white-space: pre-wrap; border-bottom: 1px solid var(--border); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
.btn { font: inherit; font-size: 14px; padding: 7px 14px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--panel); color: var(--text); cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
.btn.small { padding: 4px 10px; font-size: 13px; }
.results { margin-top: 6px; }
.summary { font-weight: 600; margin: 8px 0; }
.summary.pass { color: var(--pass); } .summary.fail { color: var(--fail); }
.case { border: 1px solid var(--border); border-left: 4px solid var(--border); border-radius: 6px; padding: 8px 12px; margin: 6px 0;
  background: var(--panel); font-size: 13.5px; overflow-wrap: anywhere; }
.case.pass { border-left-color: var(--pass); } .case.fail { border-left-color: var(--fail); }
.case .st { font-weight: 600; } .case.pass .st { color: var(--pass); } .case.fail .st { color: var(--fail); }
.case code { font-size: 13px; }
.logs { background: var(--code-bg); border-radius: 6px; padding: 8px 12px; font-size: 13px; white-space: pre-wrap; margin: 8px 0; }
.fatal { color: var(--fail); background: var(--code-bg); border-radius: 6px; padding: 10px 12px; margin: 8px 0; white-space: pre-wrap; }
details { margin: 8px 0; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; }
details summary { cursor: pointer; font-weight: 600; }
details pre { background: var(--code-bg); padding: 10px 12px; border-radius: 6px; overflow-x: auto; font-size: 13px; }
iframe.preview { width: 100%; height: 220px; border: 1px solid var(--border); border-radius: 8px; background: #fff; }
.intro { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; margin-bottom: 18px; font-size: 14px; color: var(--muted); }
.intro b { color: var(--text); }
.nav-btns { display: flex; justify-content: space-between; margin-top: 24px; }
@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; }
  nav.list { min-height: 0; border-right: 0; border-bottom: 1px solid var(--border); display: flex; overflow-x: auto; gap: 4px; padding: 8px 16px; }
  nav.list button { width: auto; flex: none; }
  nav.list .tag, .progress { display: none; }
  main { padding: 16px 16px 48px; }
  header { padding: 10px 16px; }
}
</style>
</head>
<body>
<header>
  <div>
    <h1>JavaScript Practice Set</h1>
    <div class="sub">8 JavaScript + 2 HTML/CSS questions, HackerRank style</div>
  </div>
  <div class="timer">
    <a class="btn small" href="set2.html" style="text-decoration:none">Practice Set 2 →</a>
    <a class="btn small" href="set3.html" style="text-decoration:none">Set 3: Mock Test →</a>
    <span class="clock" id="clock">60:00</span>
    <button class="btn small" id="timerBtn">Start 60-min timer</button>

  </div>
</header>
<div class="layout">
  <nav class="list" id="qlist" aria-label="Questions"></nav>
  <main id="main"></main>
</div>

<script>
// ---------- Questions ----------
const Q = [
{
  id: 'fizzbuzz', title: 'FizzBuzz', level: 'Easy', type: 'js', fn: 'fizzBuzz',
  desc: `<p>Write <code>fizzBuzz(n)</code> that returns an <b>array of strings</b> for the numbers 1 to <code>n</code>:</p>
<ul><li><code>"FizzBuzz"</code> if the number is divisible by 3 <b>and</b> 5</li><li><code>"Fizz"</code> if divisible by 3</li><li><code>"Buzz"</code> if divisible by 5</li><li>otherwise the number as a string, e.g. <code>"4"</code></li></ul>`,
  starter: `function fizzBuzz(n) {\n  // your code here\n}\n`,
  tests: [
    { args: [5], expected: ["1","2","Fizz","4","Buzz"] },
    { args: [15], expected: ["1","2","Fizz","4","Buzz","Fizz","7","8","Fizz","Buzz","11","Fizz","13","14","FizzBuzz"] },
    { args: [1], expected: ["1"] },
    { args: [0], expected: [], hidden: true },
  ],
  hints: ['Check divisibility by both 3 and 5 <b>first</b>, otherwise 15 will become "Fizz".', 'Use <code>String(i)</code> to turn a number into a string.'],
  solution: `function fizzBuzz(n) {
  const out = [];
  for (let i = 1; i <= n; i++) {
    if (i % 15 === 0) out.push("FizzBuzz");
    else if (i % 3 === 0) out.push("Fizz");
    else if (i % 5 === 0) out.push("Buzz");
    else out.push(String(i));
  }
  return out;
}`
},
{
  id: 'palindrome', title: 'Valid palindrome', level: 'Easy', type: 'js', fn: 'isPalindrome',
  desc: `<p>Write <code>isPalindrome(str)</code> that returns <code>true</code> if the string reads the same forwards and backwards.</p>
<p><b>Ignore case</b> and <b>ignore everything that isn't a letter or a digit</b> (spaces, punctuation, underscores…).</p>`,
  starter: `function isPalindrome(str) {\n  // your code here\n}\n`,
  tests: [
    { args: ["racecar"], expected: true },
    { args: ["A man, a plan, a canal: Panama"], expected: true },
    { args: ["hello"], expected: false },
    { args: [""], expected: true, hidden: true },
    { args: ["0P"], expected: false, hidden: true },
    { args: ["No 'x' in Nixon"], expected: true, hidden: true },
  ],
  hints: ['Clean the string first: <code>toLowerCase()</code>, then remove unwanted characters with <code>.replace(/[^a-z0-9]/g, "")</code>.', 'Compare the cleaned string with its reverse. You already know <code>split</code> / <code>reverse</code> / <code>join</code>.'],
  solution: `function isPalindrome(str) {
  const clean = str.toLowerCase().replace(/[^a-z0-9]/g, "");
  return clean === clean.split("").reverse().join("");
}`
},
{
  id: 'dedupe', title: 'Remove duplicates', level: 'Easy', type: 'js', fn: 'removeDuplicates',
  desc: `<p>Write <code>removeDuplicates(arr)</code> that returns a <b>new array</b> without duplicates, keeping the <b>first</b> occurrence of each value in its original order.</p>`,
  starter: `function removeDuplicates(arr) {\n  // your code here\n}\n`,
  tests: [
    { args: [[1,2,2,3,1]], expected: [1,2,3] },
    { args: [["a","b","a","c"]], expected: ["a","b","c"] },
    { args: [[]], expected: [] },
    { args: [[5,5,5,5]], expected: [5], hidden: true },
    { args: [[3,1,3,2,1]], expected: [3,1,2], hidden: true },
  ],
  hints: ['Loop through the array and keep track of what you have already seen.', 'A <code>Set</code> remembers unique values. Bonus: <code>[...new Set(arr)]</code> solves it in one line, but try the loop version first.'],
  solution: `function removeDuplicates(arr) {
  const seen = new Set();
  const out = [];
  for (const x of arr) {
    if (!seen.has(x)) {
      seen.add(x);
      out.push(x);
    }
  }
  return out;
}
// one-liner: return [...new Set(arr)];`
},
{
  id: 'anagram', title: 'Anagram check', level: 'Easy', type: 'js', fn: 'isAnagram',
  desc: `<p>Write <code>isAnagram(a, b)</code> that returns <code>true</code> if the two strings use exactly the same letters the same number of times.</p>
<p><b>Ignore case and spaces.</b></p>`,
  starter: `function isAnagram(a, b) {\n  // your code here\n}\n`,
  tests: [
    { args: ["listen","silent"], expected: true },
    { args: ["hello","world"], expected: false },
    { args: ["Dormitory","dirty room"], expected: true },
    { args: ["aab","abb"], expected: false, hidden: true },
    { args: ["",""], expected: true, hidden: true },
    { args: ["abc","abcd"], expected: false, hidden: true },
  ],
  hints: ['Write a small helper that cleans a string: lowercase it and remove spaces with <code>.replace(/ /g, "")</code>.', 'Two anagrams become identical once their letters are sorted: <code>s.split("").sort().join("")</code>. Or reuse your <code>charCount</code> idea!'],
  solution: `function isAnagram(a, b) {
  const normalize = s => s.toLowerCase().replace(/ /g, "").split("").sort().join("");
  return normalize(a) === normalize(b);
}`
},
{
  id: 'frequent', title: 'Most frequent element', level: 'Medium', type: 'js', fn: 'mostFrequent',
  desc: `<p>Write <code>mostFrequent(arr)</code> that returns the value that appears the <b>most times</b>.</p>
<ul><li>If there's a <b>tie</b>, return the one that appears <b>first</b> in the array.</li><li>If the array is empty, return <code>null</code>.</li></ul>`,
  starter: `function mostFrequent(arr) {\n  // your code here\n}\n`,
  tests: [
    { args: [[1,3,3,2,1,3]], expected: 3 },
    { args: [["a","b","b","a"]], expected: "a" },
    { args: [[7]], expected: 7 },
    { args: [[]], expected: null, hidden: true },
    { args: [[4,5,5,4,6,6,6,4]], expected: 4, hidden: true },
  ],
  hints: ['Step 1 is your <code>charCount</code> pattern: build a counting object (or a <code>Map</code>).', 'Step 2: loop through the <b>original array in order</b> and keep the best value so far. Only replace it when a count is <b>strictly greater</b> — that handles ties.'],
  solution: `function mostFrequent(arr) {
  if (arr.length === 0) return null;
  const count = new Map();
  for (const x of arr) count.set(x, (count.get(x) || 0) + 1);

  let best = arr[0];
  for (const x of arr) {
    if (count.get(x) > count.get(best)) best = x;
  }
  return best;
}`
},
{
  id: 'sort', title: 'Sort students', level: 'Medium', type: 'js', fn: 'sortStudents',
  desc: `<p>You get an array of objects like <code>{ name: "Ana", grade: 90 }</code>.</p>
<p>Write <code>sortStudents(students)</code> that returns an <b>array of names</b> sorted by:</p>
<ul><li><b>grade</b>, highest first</li><li>if grades are equal, by <b>name</b> alphabetically (A → Z)</li></ul>`,
  starter: `function sortStudents(students) {\n  // your code here\n}\n`,
  tests: [
    { args: [[{name:"Ana",grade:90},{name:"Ben",grade:85},{name:"Cal",grade:90}]], expected: ["Ana","Cal","Ben"] },
    { args: [[{name:"Zoe",grade:70},{name:"Adam",grade:70}]], expected: ["Adam","Zoe"] },
    { args: [[]], expected: [] },
    { args: [[{name:"Eve",grade:100}]], expected: ["Eve"], hidden: true },
    { args: [[{name:"Bo",grade:50},{name:"Al",grade:60},{name:"Cy",grade:50},{name:"Ab",grade:50}]], expected: ["Al","Ab","Bo","Cy"], hidden: true },
  ],
  hints: ['<code>.sort((a, b) => ...)</code> takes a compare function: return a <b>negative</b> number if <code>a</code> should come first, <b>positive</b> if <code>b</code> should.', 'Highest grade first: <code>b.grade - a.grade</code>. For names: <code>a.name.localeCompare(b.name)</code>. Then <code>.map(s => s.name)</code>.'],
  solution: `function sortStudents(students) {
  return [...students]
    .sort((a, b) => b.grade - a.grade || a.name.localeCompare(b.name))
    .map(s => s.name);
}`
},
{
  id: 'twosum', title: 'Two sum', level: 'Medium', type: 'js', fn: 'twoSum',
  desc: `<p>Write <code>twoSum(nums, target)</code> that returns the <b>indices</b> <code>[i, j]</code> (with <code>i &lt; j</code>) of the two numbers that add up to <code>target</code>.</p>
<p>There is always <b>exactly one</b> answer, and you can't use the same element twice.</p>
<p><b>Watch out:</b> one hidden test has 300,000 numbers and a 3-second limit — a nested loop will be too slow.</p>`,
  starter: `function twoSum(nums, target) {\n  // your code here\n}\n`,
  tests: [
    { args: [[2,7,11,15], 9], expected: [0,1] },
    { args: [[3,2,4], 6], expected: [1,2] },
    { args: [[3,3], 6], expected: [0,1] },
    { args: [[-1,-2,-3,-4,-5], -8], expected: [2,4], hidden: true },
    { gen: `() => { const n = Array.from({length: 300000}, (_, i) => i * 2); return [n, 1199994]; }`, label: 'twoSum(<300,000 numbers>, 1199994)', expected: [299998,299999], hidden: true },
  ],
  hints: ['Start with the simple version: two nested loops. Get the visible tests passing first.', 'Faster: loop once and store each number\'s index in a <code>Map</code>. For each number, ask "have I already seen <code>target - num</code>?"'],
  solution: `function twoSum(nums, target) {
  const seen = new Map();          // value -> index
  for (let i = 0; i < nums.length; i++) {
    const need = target - nums[i];
    if (seen.has(need)) return [seen.get(need), i];
    seen.set(nums[i], i);
  }
}`
},
{
  id: 'brackets', title: 'Balanced brackets', level: 'Medium', type: 'js', fn: 'isBalanced',
  desc: `<p>Write <code>isBalanced(s)</code> that returns <code>true</code> if every bracket <code>( ) [ ] { }</code> is closed by the right type, in the right order.</p>
<p>Any other characters should be ignored.</p>`,
  starter: `function isBalanced(s) {\n  // your code here\n}\n`,
  tests: [
    { args: ["{[()]}"], expected: true },
    { args: ["{[(])}"], expected: false },
    { args: ["((("], expected: false },
    { args: [""], expected: true, hidden: true },
    { args: ["a(b)c[d]{e}"], expected: true, hidden: true },
    { args: [")("], expected: false, hidden: true },
  ],
  hints: ['Use an array as a <b>stack</b>: <code>push</code> every opening bracket.', 'On a closing bracket, <code>pop()</code> the last opener and check it matches. An object like <code>{ ")": "(", "]": "[", "}": "{" }</code> helps. At the end, the stack must be empty.'],
  solution: `function isBalanced(s) {
  const pairs = { ")": "(", "]": "[", "}": "{" };
  const stack = [];
  for (const ch of s) {
    if (ch === "(" || ch === "[" || ch === "{") {
      stack.push(ch);
    } else if (ch in pairs) {
      if (stack.pop() !== pairs[ch]) return false;
    }
  }
  return stack.length === 0;
}`
},
{
  id: 'form', title: 'Accessible sign-up form', level: 'HTML', type: 'html',
  desc: `<p>The markup below "works" visually but is not accessible. Rewrite it so that:</p>
<ul>
<li>everything is inside a <code>&lt;form&gt;</code></li>
<li>there's an <b>email</b> input with <code>type="email"</code> and a <code>&lt;label&gt;</code> linked to it (<code>for</code> = the input's <code>id</code>)</li>
<li>there's a <b>password</b> input with <code>type="password"</code> and a linked <code>&lt;label&gt;</code></li>
<li>both inputs are <code>required</code></li>
<li>the clickable "Sign up" is a real <code>&lt;button type="submit"&gt;</code>, not a <code>&lt;div&gt;</code></li>
<li>the logo image has meaningful <code>alt</code> text</li>
</ul>`,
  starter: `<img src="https://placehold.co/120x40?text=Logo">\n<div class="form">\n  <input placeholder="Email">\n  <input placeholder="Password">\n  <div class="btn" onclick="signup()">Sign up</div>\n</div>\n`,
  hints: ['A label is linked like this: <code>&lt;label for="email"&gt;Email&lt;/label&gt; &lt;input id="email" ...&gt;</code>.', 'A placeholder is <b>not</b> a label — screen readers may skip it and it disappears when you type.'],
  solution: `<img src="https://placehold.co/120x40?text=Logo" alt="Company logo">
<form>
  <label for="email">Email</label>
  <input id="email" name="email" type="email" required>

  <label for="password">Password</label>
  <input id="password" name="password" type="password" required>

  <button type="submit">Sign up</button>
</form>`,
  check(doc) {
    const r = [];
    const form = doc.querySelector('form');
    r.push({ name: 'Has a <form> element', pass: !!form });
    const labelled = (input) => {
      if (!input) return false;
      if (input.id && doc.querySelector(`label[for="${CSS.escape(input.id)}"]`)) return true;
      return !!input.closest('label');
    };
    const email = doc.querySelector('input[type="email"]');
    r.push({ name: 'Has an input with type="email"', pass: !!email });
    r.push({ name: 'Email input has a linked <label>', pass: labelled(email) });
    const pw = doc.querySelector('input[type="password"]');
    r.push({ name: 'Has an input with type="password"', pass: !!pw });
    r.push({ name: 'Password input has a linked <label>', pass: labelled(pw) });
    r.push({ name: 'Both inputs are required', pass: !!(email && pw && email.required && pw.required) });
    const btn = form && form.querySelector('button[type="submit"], input[type="submit"]');
    r.push({ name: 'Has a submit <button> inside the form', pass: !!btn });
    r.push({ name: 'No clickable <div onclick>', pass: !doc.querySelector('div[onclick]') });
    const img = doc.querySelector('img');
    r.push({ name: 'Image has meaningful alt text', pass: !!(img && img.getAttribute('alt') && img.getAttribute('alt').trim().length > 2) });
    return r;
  }
},
{
  id: 'navbar', title: 'Flexbox navbar', level: 'CSS', type: 'css',
  desc: `<p>The HTML is fixed (shown above the editor). Write <b>CSS only</b> so that:</p>
<ul>
<li><code>.nav</code> uses <b>flexbox</b>: logo on the left, links on the right (<code>space-between</code>), vertically <b>centered</b></li>
<li><code>.links</code> has <b>no bullets</b>, no margin/padding, and lays its items out in a <b>row</b> with a <b>gap of at least 16px</b></li>
<li>the links inside <code>.links</code> have <b>no underline</b></li>
<li><code>.nav</code> has some <b>padding</b> (any amount &gt; 0)</li>
</ul>`,
  fixedHtml: `<nav class="nav">\n  <a class="logo" href="#">Brand</a>\n  <ul class="links">\n    <li><a href="#">Home</a></li>\n    <li><a href="#">About</a></li>\n    <li><a href="#">Contact</a></li>\n  </ul>\n</nav>`,
  starter: `.nav {\n  /* your CSS here */\n}\n\n.links {\n\n}\n\n.links a {\n\n}\n`,
  hints: ['<code>display: flex; justify-content: space-between; align-items: center;</code>', 'Bullets: <code>list-style: none;</code> Underline: <code>text-decoration: none;</code> Spacing between flex items: <code>gap: 16px;</code>'],
  solution: `.nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 20px;
}

.links {
  display: flex;
  gap: 16px;
  list-style: none;
  margin: 0;
  padding: 0;
}

.links a {
  text-decoration: none;
}`,
  check(doc) {
    const w = doc.defaultView;
    const cs = sel => { const el = doc.querySelector(sel); return el ? w.getComputedStyle(el) : null; };
    const nav = cs('.nav'), links = cs('.links'), a = cs('.links a');
    const r = [];
    r.push({ name: '.nav is display: flex', pass: !!nav && nav.display === 'flex' });
    r.push({ name: '.nav justify-content: space-between', pass: !!nav && nav.justifyContent === 'space-between' });
    r.push({ name: '.nav align-items: center', pass: !!nav && nav.alignItems === 'center' });
    r.push({ name: '.nav has padding', pass: !!nav && ['Top','Right','Bottom','Left'].some(s => parseFloat(nav['padding' + s]) > 0) });
    r.push({ name: '.links is display: flex (row)', pass: !!links && links.display === 'flex' && links.flexDirection === 'row' });
    r.push({ name: '.links gap is at least 16px', pass: !!links && parseFloat(links.columnGap) >= 16 });
    r.push({ name: '.links has no bullets', pass: !!links && links.listStyleType === 'none' });
    r.push({ name: '.links has no margin or padding', pass: !!links && ['marginTop','marginBottom','marginLeft','paddingLeft','paddingTop'].every(p => parseFloat(links[p]) === 0) });
    r.push({ name: '.links a has no underline', pass: !!a && !a.textDecorationLine.includes('underline') });
    return r;
  }
}
];

// ---------- Storage (best effort) ----------
const store = {
  get(k) { try { return localStorage.getItem('jsp:' + k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem('jsp:' + k, v); } catch {} },
  del(k) { try { localStorage.removeItem('jsp:' + k); } catch {} },
};

// ---------- Worker for running JS safely with a time limit ----------
const workerSrc = `
const fmt = v => { if (v === undefined) return 'undefined'; if (typeof v === 'string') return JSON.stringify(v); try { return JSON.stringify(v); } catch (e) { return String(v); } };
const logFmt = v => typeof v === 'string' ? v : fmt(v);
self.onmessage = (e) => {
  const { code, fnName, tests } = e.data;
  const logs = [];
  const fakeConsole = { log: (...a) => logs.push(a.map(logFmt).join(' ')) };
  fakeConsole.error = fakeConsole.warn = fakeConsole.info = fakeConsole.log;
  let fn;
  try {
    fn = new Function('console', code + '\\n;return typeof ' + fnName + ' === "function" ? ' + fnName + ' : undefined;')(fakeConsole);
  } catch (err) {
    postMessage({ kind: 'fatal', msg: err.name + ': ' + err.message, logs }); return;
  }
  if (typeof fn !== 'function') {
    postMessage({ kind: 'fatal', msg: 'Could not find a function named "' + fnName + '". Check the spelling and that you wrote the "function" keyword.', logs }); return;
  }
  tests.forEach((t, i) => {
    const before = logs.length;
    try {
      const args = t.gen ? (0, eval)('(' + t.gen + ')')() : JSON.parse(JSON.stringify(t.args));
      const got = fn(...args);
      const pass = JSON.stringify(got) === JSON.stringify(t.expected) && !(got === undefined && t.expected !== undefined);
      postMessage({ kind: 'result', i, pass, got: fmt(got), logs: logs.slice(before) });
    } catch (err) {
      postMessage({ kind: 'result', i, pass: false, error: err.name + ': ' + err.message, logs: logs.slice(before) });
    }
  });
  postMessage({ kind: 'done', logs });
};`;
const workerUrl = URL.createObjectURL(new Blob([workerSrc], { type: 'text/javascript' }));

// ---------- Helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmtArgs = args => args.map(a => JSON.stringify(a)).join(', ');
const isDone = q => store.get('passed:' + q.id) === '1';

let current = 0;
const startIdx = parseInt(store.get('current') || '0', 10);
if (startIdx >= 0 && startIdx < Q.length) current = startIdx;

function renderList() {
  const done = Q.filter(isDone).length;
  $('#qlist').innerHTML = `<div class="progress">${done} / ${Q.length} solved</div>` + Q.map((q, i) =>
    `<button class="${i === current ? 'active' : ''}" data-i="${i}">
       <span class="dot ${isDone(q) ? 'done' : ''}">${isDone(q) ? '✓' : ''}</span>
       <span>${i + 1}. ${esc(q.title)}</span><span class="tag">${q.level}</span>
     </button>`).join('');
  $('#qlist').querySelectorAll('button').forEach(b => b.onclick = () => go(+b.dataset.i));
}

function go(i) { current = i; store.set('current', String(i)); renderList(); renderQ(); window.scrollTo(0, 0); }

function renderQ() {
  const q = Q[current];
  const saved = store.get('code:' + q.id);
  const visible = (q.tests || []).filter(t => !t.hidden);
  const hiddenCount = (q.tests || []).filter(t => t.hidden).length;
  const lang = q.type === 'js' ? 'JavaScript' : q.type === 'html' ? 'HTML' : 'CSS';

  $('#main').innerHTML = `
    ${current === 0 ? `<div class="intro"><b>How it works:</b> write your code, then click <b>Run tests</b> (or press <b>Ctrl + Enter</b>). Like HackerRank, some tests are <b>hidden</b>, so think about edge cases. Your code is saved in this browser. Try hints before the solution, and test with <code>console.log</code>.</div>` : ''}
    <div class="q-head"><h2>${current + 1}. ${esc(q.title)}</h2><span class="chip">${q.level}</span><span class="chip">${lang}</span></div>
    <div class="desc">${q.desc}</div>
    ${visible.length ? `<div class="examples"><div class="label">Examples</div>${visible.map(t =>
      `<div><code>${esc(q.fn)}(${esc(fmtArgs(t.args))})</code> → <code>${esc(JSON.stringify(t.expected))}</code></div>`).join('')}
      ${hiddenCount ? `<div class="label" style="margin-top:6px">+ ${hiddenCount} hidden test${hiddenCount > 1 ? 's' : ''}</div>` : ''}</div>` : ''}
    <div class="editor-wrap">
      <div class="editor-bar"><span>${lang}</span><span>Tab = indent · Ctrl+Enter = run</span></div>
      ${q.fixedHtml ? `<pre class="fixed-html">${esc(q.fixedHtml)}</pre>` : ''}
      <textarea class="editor" id="editor" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="Code editor">${esc(saved ?? q.starter)}</textarea>
    </div>
    <div class="actions">
      <button class="btn primary" id="runBtn">Run tests</button>
      <button class="btn" id="resetBtn">Reset code</button>
    </div>
    ${q.type !== 'js' ? `<iframe class="preview" id="preview" sandbox="allow-same-origin" title="Preview"></iframe>` : ''}
    <div class="results" id="results"></div>
    ${q.hints.map((h, i) => `<details><summary>Hint ${i + 1}</summary><p>${h}</p></details>`).join('')}
    <details id="solDetails"><summary>Solution (try first!)</summary><pre><code>${esc(q.solution)}</code></pre></details>
    <div class="nav-btns">
      <button class="btn" id="prevBtn" ${current === 0 ? 'disabled' : ''}>← Previous</button>
      <button class="btn" id="nextBtn" ${current === Q.length - 1 ? 'disabled' : ''}>Next →</button>
    </div>`;

  const ed = $('#editor');
  ed.addEventListener('input', () => { store.set('code:' + q.id, ed.value); if (q.type !== 'js') updatePreview(); });
  ed.addEventListener('keydown', e => {
    if (e.key === 'Tab' && !e.shiftKey) {
      e.preventDefault();
      const s = ed.selectionStart, en = ed.selectionEnd;
      ed.value = ed.value.slice(0, s) + '  ' + ed.value.slice(en);
      ed.selectionStart = ed.selectionEnd = s + 2;
      store.set('code:' + q.id, ed.value);
    } else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault(); run();
    }
  });
  $('#runBtn').onclick = run;
  $('#resetBtn').onclick = () => {
    if (!confirm('Reset this question to the starter code? Your code for it will be lost.')) return;
    store.del('code:' + q.id); ed.value = q.starter; $('#results').innerHTML = ''; if (q.type !== 'js') updatePreview();
  };
  $('#prevBtn').onclick = () => current > 0 && go(current - 1);
  $('#nextBtn').onclick = () => current < Q.length - 1 && go(current + 1);
  const sol = $('#solDetails');
  sol.addEventListener('toggle', () => {
    if (sol.open && !isDone(q) && !sol.dataset.ok) {
      if (!confirm('Have you really tried it (and the hints)? Looking at the solution too early makes it harder to remember.')) { sol.open = false; return; }
      sol.dataset.ok = '1';
    }
  });
  if (q.type !== 'js') updatePreview();
}

function previewDoc(q, code) {
  const html = q.type === 'css' ? q.fixedHtml : code;
  const css = q.type === 'css' ? code : 'body{font-family:system-ui,sans-serif;padding:12px} label{display:block;margin-top:8px} input{display:block;margin-top:4px;padding:6px} button,.btn{margin-top:12px}';
  return `<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;font-family:system-ui,sans-serif;color:#111;background:#fff}${css}</style></head><body>${html}</body></html>`;
}

let previewTimer;
function updatePreview() {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(() => {
    const f = $('#preview'); if (!f) return;
    f.srcdoc = previewDoc(Q[current], $('#editor').value);
  }, 250);
}

function markPassed(q, allPass) {
  if (allPass && !isDone(q)) { store.set('passed:' + q.id, '1'); renderList(); }
}

function run() {
  const q = Q[current];
  const code = $('#editor').value;
  store.set('code:' + q.id, code);
  const out = $('#results');
  if (q.type === 'js') runJs(q, code, out);
  else runDom(q, code, out);
}

function runDom(q, code, out) {
  const f = $('#preview');
  f.onload = () => {
    f.onload = null;
    let checks;
    try { checks = q.check(f.contentDocument); }
    catch (err) { out.innerHTML = `<div class="fatal">Could not check the page: ${esc(err.message)}</div>`; return; }
    const passed = checks.filter(c => c.pass).length;
    const all = passed === checks.length;
    out.innerHTML = `<div class="summary ${all ? 'pass' : 'fail'}">${all ? '✓ All checks passed!' : `${passed} / ${checks.length} checks passed`}</div>` +
      checks.map(c => `<div class="case ${c.pass ? 'pass' : 'fail'}"><span class="st">${c.pass ? '✓' : '✗'}</span> ${esc(c.name)}</div>`).join('');
    markPassed(q, all);
  };
  f.srcdoc = previewDoc(q, code);
}

let activeWorker = null;
function runJs(q, code, out) {
  if (activeWorker) activeWorker.terminate();
  const w = new Worker(workerUrl);
  activeWorker = w;
  const results = new Array(q.tests.length).fill(null);
  out.innerHTML = '<div class="summary">Running…</div>';
  const tests = q.tests.map(t => ({ args: t.args, gen: t.gen, expected: t.expected }));
  const LIMIT = 3000;
  const timer = setTimeout(() => finish(null, true), LIMIT);
  let finished = false;

  function finish(fatal, timedOut, allLogs) {
    if (finished) return; finished = true;
    clearTimeout(timer); w.terminate(); if (activeWorker === w) activeWorker = null;
    if (fatal) {
      out.innerHTML = `<div class="summary fail">Your code didn't run</div><div class="fatal">${esc(fatal)}</div>` +
        (allLogs && allLogs.length ? `<div class="logs">${esc(allLogs.join('\n'))}</div>` : '');
      return;
    }
    const passed = results.filter(r => r && r.pass).length;
    const all = passed === q.tests.length;
    let html = `<div class="summary ${all ? 'pass' : 'fail'}">${all ? '✓ All tests passed, including hidden ones!' : `${passed} / ${q.tests.length} tests passed`}</div>`;
    if (timedOut) html += `<div class="fatal">⏱ Time limit exceeded (${LIMIT / 1000}s). Your code is too slow or stuck in an infinite loop. Tests that didn't finish are marked as failed.</div>`;
    q.tests.forEach((t, i) => {
      const r = results[i];
      const pass = r && r.pass;
      const label = t.hidden ? `Hidden test ${i + 1}` : `Test ${i + 1}`;
      let body = '';
      if (!t.hidden) {
        body = `<div><code>${esc(q.fn)}(${esc(fmtArgs(t.args))})</code></div>
                <div>Expected: <code>${esc(JSON.stringify(t.expected))}</code></div>`;
        if (r && !r.error) body += `<div>Got: <code>${esc(r.got)}</code></div>`;
      } else if (t.label) {
        body = `<div><code>${esc(t.label)}</code></div>`;
      }
      if (r && r.error) body += `<div style="color:var(--fail)">Error: ${esc(r.error)}</div>`;
      if (!r) body += `<div style="color:var(--warn)">Did not finish</div>`;
      if (!t.hidden && r && r.logs && r.logs.length) body += `<div class="logs">${esc(r.logs.join('\n'))}</div>`;
      html += `<div class="case ${pass ? 'pass' : 'fail'}"><span class="st">${pass ? '✓' : '✗'} ${label}</span>${body}</div>`;
    });
    if (!all && results.some((r, i) => r && !r.pass && q.tests[i].hidden) && results.every((r, i) => q.tests[i].hidden || (r && r.pass)))
      html += `<p style="color:var(--muted)">The visible tests pass but a hidden one fails. Think about edge cases: empty input, one element, ties, upper/lower case…</p>`;
    out.innerHTML = html;
    markPassed(q, all);
  }

  w.onmessage = e => {
    const m = e.data;
    if (m.kind === 'fatal') finish(m.msg, false, m.logs);
    else if (m.kind === 'result') results[m.i] = m;
    else if (m.kind === 'done') finish(null, false);
  };
  w.onerror = e => { e.preventDefault(); finish(e.message || 'Unknown error'); };
  w.postMessage({ code, fnName: q.fn, tests });
}

// ---------- Timer ----------
let remaining = 60 * 60, tick = null;
const drawClock = () => {
  const m = Math.floor(remaining / 60), s = remaining % 60;
  $('#clock').textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  $('#clock').classList.toggle('low', remaining <= 300);
};
$('#timerBtn').onclick = () => {
  if (tick) { clearInterval(tick); tick = null; remaining = 3600; drawClock(); $('#timerBtn').textContent = 'Start 60-min timer'; return; }
  remaining = 3600; drawClock(); $('#timerBtn').textContent = 'Reset timer';
  tick = setInterval(() => {
    remaining--; drawClock();
    if (remaining <= 0) { clearInterval(tick); tick = null; $('#timerBtn').textContent = 'Start 60-min timer'; alert("Time's up! On the real test your work would be submitted now."); }
  }, 1000);
};

// ---------- Theme toggle ----------
(() => {
  const saved = store.get('theme');
  if (saved) document.documentElement.dataset.theme = saved;
  $('#themeBtn').onclick = () => {
    const dark = document.documentElement.dataset.theme
      ? document.documentElement.dataset.theme === 'dark'
      : matchMedia('(prefers-color-scheme: dark)').matches;
    const next = dark ? 'light' : 'dark';
    document.documentElement.dataset.theme = next; store.set('theme', next);
  };
})();

renderList();
renderQ();
</script>
</body>
</html>
